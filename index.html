<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>拾级 · 全职摄影师目标打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EAD9;
  --paper-deep:#E7DDC7;
  --paper-card:#F8F3E7;
  --ink:#242019;
  --ink-soft:#6b6152;
  --ink-faint:#a89d87;
  --seal:#AD3B2A;
  --seal-dark:#832C20;
  --seal-tint:#F3DCD5;
  --indigo:#2F4258;
  --indigo-tint:#DCE4EC;
  --bronze:#96793F;
  --bronze-tint:#EFE6CC;
  --line:#DCD0B4;
  --line-soft:#EADFC6;
  --radius:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--paper);
  background-image:radial-gradient(circle at 1px 1px, rgba(36,32,25,.045) 1px, transparent 0);
  background-size:14px 14px;
  color:var(--ink);
  font-family:'Noto Sans SC',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Noto Serif SC',serif;}
button{-webkit-tap-highlight-color:transparent;}
button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;}
#app{max-width:480px;margin:0 auto;position:relative;min-height:100vh;background:var(--paper);opacity:0;transition:opacity .3s ease;}
#app.ready{opacity:1;}

/* ---------- topbar ---------- */
.topbar{padding-top:22px;}
.topbar-inner{text-align:center;padding:0 20px 14px;}
.topbar-inner h1{font-weight:900;font-size:25px;margin:0 0 4px;letter-spacing:.08em;color:var(--ink);}
.topbar-inner .sub{margin:0;font-size:12.5px;color:var(--ink-soft);}
.brush-divider{height:3px;margin:8px 24px 0;background:linear-gradient(90deg,transparent 0%,var(--ink-faint) 15%,var(--bronze) 50%,var(--ink-faint) 85%,transparent 100%);opacity:.55;border-radius:2px;}

/* ---------- views ---------- */
.view{padding-bottom:calc(88px + env(safe-area-inset-bottom));min-height:60vh;}

/* ---------- overview hero ring ---------- */
.hero{display:flex;flex-direction:column;align-items:center;padding:20px 0 8px;}
.ring-wrap{position:relative;width:132px;height:132px;}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--line);stroke-width:9;}
.ring-fill{fill:none;stroke:var(--bronze);stroke-width:9;stroke-linecap:round;stroke-dasharray:263.89;stroke-dashoffset:263.89;transition:stroke-dashoffset .3s ease;}
.hero-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:30px;font-weight:900;color:var(--ink);}
.hero-sub{margin-top:8px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.08em;}

.stat-row{display:flex;justify-content:center;gap:30px;margin:16px 0 20px;}
.stat-item{text-align:center;}
.stat-item strong{display:block;font-family:'Noto Serif SC',serif;font-size:19px;font-weight:700;}
.stat-item span{font-size:11.5px;color:var(--ink-soft);}

.time-block{padding:14px 16px;background:var(--paper-card);margin:0 16px 18px;border-radius:var(--radius);border:1px solid var(--line-soft);}
.time-label-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
.time-label-row span:first-child{color:var(--ink-soft);}
.time-label-row span:last-child{font-weight:700;color:var(--indigo);}
.time-bar-track{height:6px;background:var(--indigo-tint);border-radius:3px;overflow:hidden;}
.time-bar-fill{height:100%;width:0%;background:var(--indigo);border-radius:3px;transition:width .3s ease;}
.time-daylabel{margin:9px 0 0;font-size:12.5px;color:var(--ink-soft);}
.plan-note{margin:6px 0 0;font-size:11.5px;color:var(--ink-faint);line-height:1.65;}

.section-title{font-size:15px;font-weight:700;margin:4px 20px 10px;}
.urgent-list{margin:0 16px 22px;display:flex;flex-direction:column;gap:8px;}
.urgent-item{display:flex;align-items:center;gap:8px;width:100%;background:var(--paper-card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:9px 11px;text-align:left;cursor:pointer;font-family:inherit;}
.urgent-title{flex:1;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.urgent-days{font-size:11.5px;color:var(--seal-dark);font-weight:700;white-space:nowrap;}
.empty-tip{margin:0 16px 22px;font-size:13px;color:var(--ink-soft);text-align:center;padding:16px;background:var(--paper-card);border-radius:var(--radius);border:1px dashed var(--line);}

.modlist{margin:0 16px 8px;display:flex;flex-direction:column;gap:11px;}
.modrow{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;width:100%;}
.modrow-num{font-family:'Noto Serif SC',serif;font-size:11.5px;color:var(--bronze);font-weight:700;width:20px;flex-shrink:0;}
.modrow-name{font-size:12.5px;color:var(--ink);width:100px;text-align:left;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modrow-bar{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;display:block;}
.modrow-bar span{display:block;height:100%;background:var(--bronze);border-radius:3px;}
.modrow-pct{font-size:12px;color:var(--ink-soft);width:32px;text-align:right;flex-shrink:0;}

.reset-link{display:block;margin:10px auto 30px;background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;}

/* ---------- goals view ---------- */
.goals-toolbar{display:flex;gap:10px;padding:16px 16px 4px;}
.goals-toolbar button{flex:1;padding:8px 0;border-radius:5px;border:1px solid var(--line);background:var(--paper-card);font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
#goals-list{padding:0 16px;}

.modacc{border-bottom:1px solid var(--line-soft);padding:12px 0;}
.modacc:last-child{border-bottom:none;}
.modacc-head{width:100%;background:none;border:none;padding:0;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);}
.modnum{font-family:'Noto Serif SC',serif;font-weight:700;font-size:13px;color:var(--bronze);width:22px;flex-shrink:0;}
.modname{flex:1;font-size:15px;font-weight:500;}
.modmeta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
.chevron{transition:transform .2s ease;color:var(--ink-faint);font-size:11px;display:inline-block;}
.modacc.open .chevron{transform:rotate(180deg);}
.modacc-bar{height:3px;background:var(--line-soft);border-radius:2px;margin-top:9px;overflow:hidden;}
.modacc-bar-fill{height:100%;width:0%;background:var(--bronze);border-radius:2px;transition:width .25s ease;}
.modacc-body{margin-top:13px;}
.modacc-redirect{font-size:13px;color:var(--ink-soft);margin:2px 0 12px;line-height:1.6;}
.gotobtn{background:var(--seal);color:#fff;border:none;padding:9px 16px;border-radius:5px;font-size:13px;cursor:pointer;font-family:inherit;}

/* ---------- goal card (shared) ---------- */
.goalcard{position:relative;background:var(--paper-card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:13px 14px 14px;margin-bottom:10px;}
.goalcard.done{border-color:var(--bronze);}
.goalcard-head{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
.goalcard-head h4{margin:0;font-size:14.5px;font-weight:500;line-height:1.55;font-family:'Noto Sans SC',sans-serif;}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;letter-spacing:.04em;flex-shrink:0;}
.tag-core{background:var(--seal);color:#fff;}
.tag-high{border:1px solid var(--bronze);color:var(--bronze);}
.tag-mid{border:1px solid var(--ink-faint);color:var(--ink-soft);}
.seglabel{margin:0 0 2px;font-size:12px;color:var(--ink-soft);}
.seggrid{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0;}
.seg{width:clamp(22px,7.5vw,32px);height:clamp(22px,7.5vw,32px);border-radius:4px;border:1.5px solid var(--line);background:var(--paper-deep);cursor:pointer;padding:0;transition:background .15s ease,border-color .15s ease;}
.seg:active{transform:scale(.92);}
.seg.checked{background:var(--seal);border-color:var(--seal-dark);box-shadow:inset 0 1px 3px rgba(0,0,0,.35);animation:stampIn .28s ease-out;}
@keyframes stampIn{0%{transform:scale(1.6) rotate(-14deg);opacity:0;}60%{transform:scale(.92) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
.goalcard-foot{display:flex;align-items:center;gap:9px;margin-top:2px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}
.fraction{font-weight:700;color:var(--ink);}
.daterange{color:var(--ink-faint);}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.badge-normal{background:var(--paper-deep);color:var(--ink-soft);}
.badge-urgent{background:var(--seal-tint);color:var(--seal-dark);font-weight:700;}
.badge-overdue{background:var(--seal);color:#fff;font-weight:700;}
.badge-upcoming{background:var(--indigo-tint);color:var(--indigo);}
.badge-done{background:var(--bronze-tint);color:#5c4a1f;}
.goalnote{margin:9px 0 0;padding:8px 10px;background:var(--paper-deep);border-left:2px solid var(--bronze);font-size:12px;color:var(--ink-soft);border-radius:2px;line-height:1.55;}
.stamp-mark{position:absolute;top:10px;right:12px;width:34px;height:34px;border:2px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-weight:900;font-size:16px;border-radius:4px;transform:rotate(-10deg);opacity:.85;}

/* ---------- threshold view ---------- */
.threshold-hero{display:flex;flex-direction:column;align-items:center;padding:18px 20px 10px;text-align:center;}
.th-quote{font-size:12.5px;color:var(--ink-soft);background:var(--paper-card);border:1px solid var(--line-soft);padding:11px 13px;border-radius:var(--radius);margin:0 0 18px;line-height:1.65;}
.seal-wrap{position:relative;width:156px;height:156px;margin-bottom:8px;}
.seal-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.seal-track{fill:none;stroke:var(--seal-tint);stroke-width:10;}
.seal-fill{fill:none;stroke:var(--seal);stroke-width:10;stroke-linecap:round;stroke-dasharray:263.89;stroke-dashoffset:263.89;transition:stroke-dashoffset .3s ease;}
#th-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:32px;font-weight:900;color:var(--seal-dark);}
#th-count{font-size:13px;color:var(--ink-soft);margin-bottom:16px;}
.th-unlock-msg{background:var(--seal);color:#fff;padding:13px 16px;border-radius:6px;font-size:13.5px;line-height:1.65;margin:2px 4px 6px;}
#th-goal-list{padding:4px 16px 10px;}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;background:var(--paper-card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:6px 0;color:var(--ink-faint);font-family:'Noto Sans SC',sans-serif;font-size:11px;cursor:pointer;}
.tab.active{color:var(--seal);}
.tab svg{width:20px;height:20px;}

/* ---------- modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(36,32,25,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;}
.modal-mask[hidden]{display:none;}
.modal-box{background:var(--paper-card);border-radius:8px;padding:22px;max-width:320px;width:100%;text-align:center;}
.modal-box p{font-size:13.5px;line-height:1.65;margin:0 0 18px;color:var(--ink);}
.modal-actions{display:flex;gap:10px;}
.modal-actions button{flex:1;padding:11px 0;border-radius:6px;font-size:13.5px;cursor:pointer;border:none;font-family:inherit;}
#reset-cancel{background:var(--paper-deep);color:var(--ink);}
#reset-confirm{background:var(--seal);color:#fff;}

@media (prefers-reduced-motion:reduce){
  .seg.checked{animation:none;}
  *{transition-duration:.01ms !important;}
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-inner">
      <h1>拾级</h1>
      <p class="sub">全职摄影师准备之路 · 杭州汉服写真</p>
    </div>
    <div class="brush-divider"></div>
  </header>

  <main id="view-overview" class="view">
    <section class="hero">
      <div class="ring-wrap">
        <svg viewBox="0 0 100 100">
          <circle class="ring-track" cx="50" cy="50" r="42"/>
          <circle class="ring-fill" id="ov-ring-fill" cx="50" cy="50" r="42"/>
        </svg>
        <div class="hero-pct" id="ov-hero-pct">0%</div>
      </div>
      <div class="hero-sub">目标完成度</div>
    </section>

    <div class="stat-row">
      <div class="stat-item"><strong id="ov-done-count">0</strong><span>已完成</span></div>
      <div class="stat-item"><strong id="ov-inprogress-count">0</strong><span>进行中</span></div>
      <div class="stat-item"><strong id="ov-total-count">132</strong><span>总目标</span></div>
    </div>

    <section class="time-block">
      <div class="time-label-row"><span>计划时间进度</span><span id="ov-time-pct">0%</span></div>
      <div class="time-bar-track"><div class="time-bar-fill" id="ov-time-bar"></div></div>
      <p class="time-daylabel" id="ov-day-label">—</p>
      <p class="plan-note">核心方向：杭州汉服写真（古画风＋奇幻风）｜拍摄相关目标统一安排在 2026 年 9 月 1 日之后</p>
    </section>

    <h3 class="section-title">近期需要关注</h3>
    <div class="urgent-list" id="ov-urgent-list"></div>

    <h3 class="section-title">十二个模块</h3>
    <div class="modlist" id="ov-modlist"></div>

    <button id="reset-btn" class="reset-link">重置全部打卡记录</button>
  </main>

  <main id="view-goals" class="view" hidden>
    <div class="goals-toolbar">
      <button id="expand-all">展开全部</button>
      <button id="collapse-all">收起全部</button>
    </div>
    <div id="goals-list"></div>
  </main>

  <main id="view-threshold" class="view" hidden>
    <section class="threshold-hero">
      <p class="th-quote">建议"辞职门槛"模块全部完成后，再进行最终辞职评估。</p>
      <div class="seal-wrap">
        <svg viewBox="0 0 100 100">
          <circle class="seal-track" cx="50" cy="50" r="42"/>
          <circle class="seal-fill" id="th-ring-fill" cx="50" cy="50" r="42"/>
        </svg>
        <div id="th-pct">0%</div>
      </div>
      <div id="th-count">0/10 项已达成</div>
      <p class="th-unlock-msg" id="th-unlock-msg" hidden>十二关已全部达成 — 可以认真评估辞职这件事了。</p>
    </section>
    <div id="th-goal-list"></div>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/></svg>
      <span>总览</span>
    </button>
    <button class="tab" data-view="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M8.5 12l2.3 2.3L15.5 9.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>目标</span>
    </button>
    <button class="tab" data-view="threshold">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      <span>门槛</span>
    </button>
  </nav>

</div>

<div id="reset-modal" class="modal-mask" hidden>
  <div class="modal-box">
    <p>确定要清空所有打卡记录吗？此操作无法撤销。</p>
    <div class="modal-actions">
      <button id="reset-cancel">取消</button>
      <button id="reset-confirm">确定清空</button>
    </div>
  </div>

<script>
const GOALS = JSON.parse(document.getElementById('goals-data').textContent);
const PLAN_START = '2026-07-10';
const PLAN_END = '2027-03-03';
const RING_C = 2*Math.PI*42;

let progress = {};

function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayMidnight(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

function checkedCount(goal){ return (progress[goal.id]||[]).filter(Boolean).length; }
function goalStatus(goal){
  const c = checkedCount(goal);
  if(c===0) return 'notstarted';
  if(c===goal.segments) return 'done';
  return 'inprogress';
}
function goalPercent(goal){ return Math.round(checkedCount(goal)/goal.segments*100); }

function goalTiming(goal){
  if(goalStatus(goal)==='done') return {state:'done'};
  const today = todayMidnight();
  const start = parseYMD(goal.startDate);
  const due = parseYMD(goal.dueDate);
  if(today < start) return {state:'upcoming', days: daysBetween(today,start)};
  const remain = daysBetween(today,due);
  if(remain < 0) return {state:'overdue', days: -remain};
  if(remain <= 7) return {state:'urgent', days: remain};
  return {state:'normal', days: remain};
}

const MODULE_ORDER = [];
const MODULE_MAP = {};
GOALS.forEach(g=>{
  if(!MODULE_MAP[g.moduleNum]){ MODULE_MAP[g.moduleNum] = {num:g.moduleNum, name:g.moduleName, goals:[]}; MODULE_ORDER.push(g.moduleNum); }
  MODULE_MAP[g.moduleNum].goals.push(g);
});

function moduleStats(num){
  const goals = MODULE_MAP[num].goals;
  let total=0, checked=0, doneCount=0;
  goals.forEach(g=>{ total+=g.segments; checked+=checkedCount(g); if(goalStatus(g)==='done') doneCount++; });
  return {total, checked, pct: total? Math.round(checked/total*100):0, goalCount:goals.length, doneCount};
}

function overallStats(){
  let total=0, checked=0, doneGoals=0, inProgressGoals=0;
  GOALS.forEach(g=>{
    total+=g.segments; checked+=checkedCount(g);
    const s = goalStatus(g);
    if(s==='done') doneGoals++; else if(s==='inprogress') inProgressGoals++;
  });
  return {total, checked, pct: total? Math.round(checked/total*100):0, doneGoals, inProgressGoals, totalGoals:GOALS.length};
}

function planTimeStats(){
  const start=parseYMD(PLAN_START), end=parseYMD(PLAN_END), today=todayMidnight();
  const totalDays = daysBetween(start,end);
  const rawElapsed = daysBetween(start,today);
  const elapsed = Math.max(0, Math.min(totalDays, rawElapsed));
  const pct = totalDays? Math.round(elapsed/totalDays*100):0;
  let dayLabel;
  if(rawElapsed < 0){
    dayLabel = `计划 ${PLAN_START} 启动 · 还有 ${-rawElapsed} 天`;
  } else if(rawElapsed > totalDays){
    dayLabel = '计划周期已结束';
  } else {
    dayLabel = `第 ${elapsed+1} 天 / 共 ${totalDays} 天`;
  }
  return {totalDays, elapsed, pct, dayLabel};
}

function urgentList(){
  const items = [];
  GOALS.forEach(g=>{ const t=goalTiming(g); if(t.state==='urgent'||t.state==='overdue') items.push({goal:g,timing:t}); });
  items.sort((a,b)=>{
    if(a.timing.state!==b.timing.state) return a.timing.state==='overdue' ? -1:1;
    return a.timing.days - b.timing.days;
  });
  return items;
}

const MEMORY_KEY = 'shiji-photographer-progress-v2';
const LEGACY_MEMORY_KEYS = ['shiji-photographer-progress-v1', 'progress'];
const WINDOW_NAME_PREFIX = '__SHIJI_PROGRESS_V2__:';

function parseProgressValue(value){
  if(value == null || value === '') return null;
  try{
    const parsed = typeof value === 'string' ? JSON.parse(value) : value;
    if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return null;
    return parsed;
  }catch(e){
    console.warn('忽略无法解析的旧进度数据', e);
    return null;
  }
}

function readLocalProgress(){
  try{
    const keys = [MEMORY_KEY, ...LEGACY_MEMORY_KEYS];
    for(const key of keys){
      const parsed = parseProgressValue(localStorage.getItem(key));
      if(parsed) return parsed;
    }
  }catch(e){
    console.warn('当前页面无法读取 localStorage', e);
  }
  return null;
}

function readWindowNameProgress(){
  try{
    if(typeof window.name === 'string' && window.name.startsWith(WINDOW_NAME_PREFIX)){
      return parseProgressValue(window.name.slice(WINDOW_NAME_PREFIX.length));
    }
  }catch(e){
    console.warn('当前页面无法读取临时刷新记忆', e);
  }
  return null;
}

function withTimeout(promise, ms = 1200){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('存储接口响应超时')), ms))
  ]);
}

function saveProgressImmediately(){
  const value = JSON.stringify(progress);
  let saved = false;

  // 必须先同步写入，避免用户打卡后立刻刷新导致异步保存被中断。
  try{
    localStorage.setItem(MEMORY_KEY, value);
    saved = true;
  }catch(e){
    console.warn('localStorage 保存失败', e);
  }

  // window.name 作为本地文件和应用内预览的刷新兜底；同一标签页刷新后仍可恢复。
  try{
    window.name = WINDOW_NAME_PREFIX + value;
    saved = true;
  }catch(e){
    console.warn('临时刷新记忆保存失败', e);
  }

  return saved;
}

async function loadProgress(){
  // 普通浏览器优先读取同步本地存储，防止异步接口卡住页面初始化。
  const local = readLocalProgress();
  if(local) return local;

  const tabMemory = readWindowNameProgress();
  if(tabMemory) return tabMemory;

  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await withTimeout(window.storage.get(MEMORY_KEY));
      const parsed = parseProgressValue(res && res.value);
      if(parsed){
        progress = parsed;
        saveProgressImmediately();
        return parsed;
      }
    }
  }catch(e){
    console.warn('window.storage 读取失败', e);
  }

  return {};
}

async function saveProgress(){
  const savedSynchronously = saveProgressImmediately();
  const value = JSON.stringify(progress);
  let savedRemotely = false;

  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await withTimeout(window.storage.set(MEMORY_KEY, value));
      savedRemotely = true;
    }
  }catch(e){
    console.warn('window.storage 保存失败', e);
  }

  if(!savedSynchronously && !savedRemotely){
    console.error('进度未能保存：请通过 Safari/Chrome 的 http 或 https 页面打开，而不是直接预览本地文件。');
  }
}

window.addEventListener('pagehide', saveProgressImmediately);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') saveProgressImmediately();
});
function ensureProgressShape(){
  GOALS.forEach(g=>{
    const old = Array.isArray(progress[g.id]) ? progress[g.id] : [];
    progress[g.id] = new Array(g.segments).fill(false).map((v,i)=> !!old[i]);
  });
}

function setRing(id, pct){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.strokeDasharray = RING_C.toFixed(2);
  el.style.strokeDashoffset = (RING_C - RING_C*pct/100).toFixed(2);
}

function priorityTagHTML(p){
  const cls = p==='核心' ? 'tag-core' : (p==='高' ? 'tag-high' : 'tag-mid');
  return `<span class="tag ${cls}">${p}</span>`;
}
function timingBadgeHTML(goal){
  const t = goalTiming(goal);
  if(t.state==='done') return `<span class="badge badge-done">已完成</span>`;
  if(t.state==='upcoming') return `<span class="badge badge-upcoming">${t.days}天后开始</span>`;
  if(t.state==='overdue') return `<span class="badge badge-overdue">已逾期${t.days}天</span>`;
  if(t.state==='urgent') return `<span class="badge badge-urgent">${t.days===0?'今天到期':t.days+'天内到期'}</span>`;
  return `<span class="badge badge-normal">剩${t.days}天</span>`;
}
function segGridHTML(goal){
  const arr = progress[goal.id];
  let html = '<div class="seggrid">';
  for(let i=0;i<goal.segments;i++){
    html += `<button class="seg${arr[i]?' checked':''}" data-goal="${goal.id}" data-idx="${i}" aria-label="第${i+1}格"></button>`;
  }
  return html + '</div>';
}
function goalCardHTML(goal){
  const done = goalStatus(goal)==='done';
  return `<div class="goalcard${done?' done':''}" id="goal-${goal.id}">
    ${done?'<div class="stamp-mark">成</div>':''}
    <div class="goalcard-head">${priorityTagHTML(goal.priority)}<h4>${goal.title}</h4></div>
    ${goal.segmentLabel?`<p class="seglabel">每格代表：${goal.segmentLabel}</p>`:''}
    ${segGridHTML(goal)}
    <div class="goalcard-foot">
      <span class="fraction" id="goal-${goal.id}-frac">${checkedCount(goal)}/${goal.segments}</span>
      <span class="daterange">${goal.startDate.slice(5)} → ${goal.dueDate.slice(5)}</span>
      <span id="goal-${goal.id}-badge">${timingBadgeHTML(goal)}</span>
    </div>
    ${goal.notes?`<p class="goalnote">${goal.notes}</p>`:''}
  </div>`;
}

function moduleAccordionHTML(mod){
  const s = moduleStats(mod.num);
  const isThreshold = mod.num === '12';
  return `<section class="modacc" data-mod="${mod.num}">
    <button class="modacc-head" data-toggle="${mod.num}">
      <span class="modnum">${mod.num}</span>
      <span class="modname">${mod.name}</span>
      <span class="modmeta"><span id="mod-${mod.num}-pct">${s.pct}%</span><span class="modcount">${s.doneCount}/${s.goalCount}</span></span>
      <span class="chevron">▾</span>
    </button>
    <div class="modacc-bar"><div class="modacc-bar-fill" id="mod-${mod.num}-bar" style="width:${s.pct}%"></div></div>
    <div class="modacc-body" id="modbody-${mod.num}" hidden>
      ${isThreshold
        ? `<p class="modacc-redirect">十二关的最终判断单独放在"门槛"页签，方便随时查看整体达成情况。</p><button class="gotobtn" data-goto-threshold="1">前往门槛页 →</button>`
        : mod.goals.map(goalCardHTML).join('')}
    </div>
  </section>`;
}

function renderOverview(){
  const stats = overallStats();
  const time = planTimeStats();
  const urgent = urgentList();

  document.getElementById('ov-hero-pct').textContent = stats.pct+'%';
  setRing('ov-ring-fill', stats.pct);
  document.getElementById('ov-done-count').textContent = stats.doneGoals;
  document.getElementById('ov-inprogress-count').textContent = stats.inProgressGoals;
  document.getElementById('ov-total-count').textContent = stats.totalGoals;

  document.getElementById('ov-time-pct').textContent = time.pct+'%';
  document.getElementById('ov-time-bar').style.width = time.pct+'%';
  document.getElementById('ov-day-label').textContent = time.dayLabel;

  const uWrap = document.getElementById('ov-urgent-list');
  if(urgent.length===0){
    uWrap.innerHTML = `<p class="empty-tip">近期没有紧急目标，按计划推进就好。</p>`;
  } else {
    uWrap.innerHTML = urgent.slice(0,6).map(({goal,timing})=>`
      <button class="urgent-item" data-goto="${goal.id}">
        <span class="tag ${timing.state==='overdue'?'tag-core':'tag-high'}">${timing.state==='overdue'?'逾期':'临期'}</span>
        <span class="urgent-title">${goal.title}</span>
        <span class="urgent-days">${timing.state==='overdue' ? '逾期'+timing.days+'天' : timing.days+'天'}</span>
      </button>`).join('');
  }

  const mWrap = document.getElementById('ov-modlist');
  mWrap.innerHTML = MODULE_ORDER.map(num=>{
    const m = MODULE_MAP[num]; const s = moduleStats(num);
    return `<button class="modrow" data-goto-mod="${num}">
      <span class="modrow-num">${num}</span>
      <span class="modrow-name">${m.name}</span>
      <span class="modrow-bar"><span style="width:${s.pct}%"></span></span>
      <span class="modrow-pct">${s.pct}%</span>
    </button>`;
  }).join('');
}

function renderGoalsView(){
  document.getElementById('goals-list').innerHTML = MODULE_ORDER.map(num=>moduleAccordionHTML(MODULE_MAP[num])).join('');
}

function renderThreshold(){
  const s = moduleStats('12');
  document.getElementById('th-pct').textContent = s.pct+'%';
  setRing('th-ring-fill', s.pct);
  document.getElementById('th-count').textContent = `${s.doneCount}/${s.goalCount} 项已达成`;
  document.getElementById('th-unlock-msg').hidden = s.pct !== 100;
  document.getElementById('th-goal-list').innerHTML = MODULE_MAP['12'].goals.map(goalCardHTML).join('');
}

function renderAll(){ renderOverview(); renderGoalsView(); renderThreshold(); }

function updateGoalDOM(goal){
  const card = document.getElementById('goal-'+goal.id);
  if(!card) return;
  const arr = progress[goal.id];
  card.querySelectorAll('.seg').forEach((cell,i)=> cell.classList.toggle('checked', !!arr[i]));
  const done = goalStatus(goal)==='done';
  card.classList.toggle('done', done);
  const fracEl = document.getElementById(`goal-${goal.id}-frac`);
  if(fracEl) fracEl.textContent = `${checkedCount(goal)}/${goal.segments}`;
  const badgeEl = document.getElementById(`goal-${goal.id}-badge`);
  if(badgeEl) badgeEl.innerHTML = timingBadgeHTML(goal);
  const stamp = card.querySelector('.stamp-mark');
  if(done && !stamp) card.insertAdjacentHTML('afterbegin','<div class="stamp-mark">成</div>');
  else if(!done && stamp) stamp.remove();
}
function updateModuleDOM(num){
  const s = moduleStats(num);
  const pctEl = document.getElementById('mod-'+num+'-pct');
  if(pctEl) pctEl.textContent = s.pct+'%';
  const barEl = document.getElementById('mod-'+num+'-bar');
  if(barEl) barEl.style.width = s.pct+'%';
  const countEl = document.querySelector(`.modacc[data-mod="${num}"] .modcount`);
  if(countEl) countEl.textContent = `${s.doneCount}/${s.goalCount}`;
}

function toggleSeg(goalId, idx){
  const goal = GOALS.find(g=>g.id===goalId);
  progress[goalId][idx] = !progress[goalId][idx];
  saveProgress();
  updateGoalDOM(goal);
  updateModuleDOM(goal.moduleNum);
  renderOverview();
  if(goal.moduleNum==='12') renderThreshold();
}

function switchTab(view){
  document.querySelectorAll('.view').forEach(v=> v.hidden = (v.id !== 'view-'+view));
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.view===view));
}
function expandModule(num){
  const body = document.getElementById('modbody-'+num);
  if(!body) return;
  body.hidden = false;
  document.querySelector(`.modacc[data-mod="${num}"]`).classList.add('open');
  requestAnimationFrame(()=> body.closest('.modacc').scrollIntoView({behavior:'smooth', block:'start'}));
}
function goToGoal(goalId){
  const goal = GOALS.find(g=>g.id===goalId);
  if(goal.moduleNum==='12'){ switchTab('threshold'); }
  else { switchTab('goals'); expandModule(goal.moduleNum); }
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const card = document.getElementById('goal-'+goalId);
      if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
    }, 60);
  });
}

document.getElementById('app').addEventListener('click', (e)=>{
  const seg = e.target.closest('.seg');
  if(seg){ toggleSeg(Number(seg.dataset.goal), Number(seg.dataset.idx)); return; }
  const toggleBtn = e.target.closest('[data-toggle]');
  if(toggleBtn){
    const num = toggleBtn.dataset.toggle;
    const body = document.getElementById('modbody-'+num);
    body.hidden = !body.hidden;
    toggleBtn.closest('.modacc').classList.toggle('open', !body.hidden);
    return;
  }
  const gotoModBtn = e.target.closest('[data-goto-mod]');
  if(gotoModBtn){ switchTab('goals'); expandModule(gotoModBtn.dataset.gotoMod); return; }
  const gotoBtn = e.target.closest('[data-goto]');
  if(gotoBtn){ goToGoal(Number(gotoBtn.dataset.goto)); return; }
  const gotoThreshold = e.target.closest('[data-goto-threshold]');
  if(gotoThreshold){ switchTab('threshold'); return; }
});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=> switchTab(t.dataset.view));
});
document.getElementById('expand-all').addEventListener('click', ()=>{
  document.querySelectorAll('.modacc-body').forEach(b=> b.hidden=false);
  document.querySelectorAll('.modacc').forEach(m=> m.classList.add('open'));
});
document.getElementById('collapse-all').addEventListener('click', ()=>{
  document.querySelectorAll('.modacc-body').forEach(b=> b.hidden=true);
  document.querySelectorAll('.modacc').forEach(m=> m.classList.remove('open'));
});
document.getElementById('reset-btn').addEventListener('click', ()=>{ document.getElementById('reset-modal').hidden = false; });
document.getElementById('reset-cancel').addEventListener('click', ()=>{ document.getElementById('reset-modal').hidden = true; });
document.getElementById('reset-confirm').addEventListener('click', async ()=>{
  GOALS.forEach(g=> progress[g.id] = new Array(g.segments).fill(false));
  await saveProgress();
  renderAll();
  document.getElementById('reset-modal').hidden = true;
});

(async function init(){
  const app = document.getElementById('app');
  try{
    progress = await loadProgress();
    if(!progress || typeof progress !== 'object' || Array.isArray(progress)) progress = {};
    ensureProgressShape();
    renderAll();
  }catch(e){
    console.error('页面初始化失败，已使用空进度恢复', e);
    progress = {};
    ensureProgressShape();
    try{ renderAll(); }catch(renderError){ console.error('页面渲染失败', renderError); }
  }finally{
    app.classList.add('ready');
  }
})();
</script>
</body>
